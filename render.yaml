services:
  - type: web
    name: invoice-a2a-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    disk:
      name: invoice-agent-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: A2A_BEARER_TOKEN
        generateValue: true
      - key: A2A_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
